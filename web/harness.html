<!doctype html><html><head><meta charset="utf-8"></head><body>
<script src="engine.js"></script>
<script>
window.ready = (async () => {
  await ScriptureEngine.loadFonts("fonts/");
  await ScriptureEngine.loadPromo("promo.jpg");
  await document.fonts.ready;
  window.LIB = await (await fetch("library.json")).json();
  return true;
})();
window.renderPost = async (id, opts) => {
  const post = LIB.posts.find(p => p.id === id);
  const slides = ScriptureEngine.buildSlides(post, LIB);
  const imgs = slides.map((s, i) => ScriptureEngine.renderSlide(s, post, i, opts || {}).toDataURL("image/jpeg", 0.92));
  return { id, title: post.ti, caption: ScriptureEngine.caption(post, LIB), imgs };
};
// daily word as a full-screen 1080x1920 frame (for the daily video)
window.renderTall = async (id, opts) => {
  const post = LIB.posts.find(p => p.id === id);
  const slides = ScriptureEngine.buildSlides(post, LIB);
  return ScriptureEngine.renderSlide(slides[0], post, 0, Object.assign({}, opts || {}, { tall: true })).toDataURL("image/jpeg", 0.95);
};
</script></body></html>
